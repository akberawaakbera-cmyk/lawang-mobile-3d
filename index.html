<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101820;
  color:white;
  font-size:20px;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.45);
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.5;
  pointer-events:none;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:28px;
  height:28px;
  z-index:120;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px #000;
}

#crosshair:before{
  width:2px;
  height:28px;
  left:13px;
  top:0;
}

#crosshair:after{
  width:28px;
  height:2px;
  left:0;
  top:13px;
}

/* JOYSTICK */

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  z-index:200;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.35);
  touch-action:none;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  margin-left:-31px;
  margin-top:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.65);
  pointer-events:none;
}

/* RUN */

#runButton{
  position:fixed;
  left:175px;
  bottom:40px;
  width:70px;
  height:70px;
  border-radius:50%;
  z-index:200;
  border:2px solid rgba(255,255,255,.5);
  background:rgba(35,136,255,.35);
  color:white;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

/* CAMERA */

#cameraArea{
  position:fixed;
  right:0;
  top:0;
  width:62%;
  height:75%;
  z-index:50;
  touch-action:none;
}

/* STATUS */

#status{
  position:fixed;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  color:white;
  background:rgba(0,0,0,.45);
  padding:5px 10px;
  border-radius:8px;
  font-size:11px;
  pointer-events:none;
}

@media (orientation:portrait){
  #loading:after{
    content:" Rotate your iPhone to landscape";
    margin-left:8px;
    color:#7fc8ff;
  }
}
</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<canvas id="game"></canvas>

<div id="hud">
  <strong>LAWANG MOBILE 3D</strong><br>
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weapon">PISTOL</span><br>
  Kills: <span id="score">0</span>
</div>

<div id="crosshair"></div>

<div id="cameraArea"></div>

<div id="joystick">
  <div id="joystickKnob"></div>
</div>

<div id="runButton">
  RUN
</div>

<div id="status">
  LOADING
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

/* SKY */

scene.background =
new THREE.Color(0x79c9ff);

scene.fog =
new THREE.Fog(
  0x79c9ff,
  55,
  180
);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  .1,
  500
);

camera.position.set(
  0,
  4,
  8
);

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);

/* LIGHT */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sun.position.set(
  40,
  70,
  30
);

scene.add(sun);

scene.add(
  new THREE.HemisphereLight(
    0xbfe8ff,
    0x405020,
    1.2
  )
);

/* GROUND */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    180,
    180
  ),
  new THREE.MeshStandardMaterial({
    color:0x4d9144
  })
);

ground.rotation.x =
-Math.PI / 2;

scene.add(ground);

/* ROAD */

function createRoad(
  x,
  z,
  width,
  depth
){

  const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      .08,
      depth
    ),
    new THREE.MeshStandardMaterial({
      color:0x353535
    })
  );

  road.position.set(
    x,
    .04,
    z
  );

  scene.add(road);
}

createRoad(0,0,180,9);
createRoad(0,0,9,180);
createRoad(0,35,180,7);
createRoad(35,0,7,180);

/* BUILDING COLLISION DATA */

window.buildingColliders = [];

/* HOUSE */

function createHouse(
  x,
  z,
  w,
  d,
  h
){

  const group =
  new THREE.Group();

  /* MAIN HOUSE */

  const house =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      h,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0xd2b48c
    })
  );

  house.position.y =
  h / 2;

  group.add(house);

  /* ROOF */

  const roof =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      Math.max(w,d)*.72,
      3,
      4
    ),
    new THREE.MeshStandardMaterial({
      color:0x8b3e2f
    })
  );

  roof.rotation.y =
  Math.PI / 4;

  roof.position.y =
  h + 1.5;

  group.add(roof);

  /* DOOR */

  const door =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2,
      3,
      .15
    ),
    new THREE.MeshStandardMaterial({
      color:0x4b2818
    })
  );

  door.position.set(
    0,
    1.5,
    d / 2 + .08
  );

  group.add(door);

  /* WINDOWS */

  const windowMaterial =
  new THREE.MeshStandardMaterial({
    color:0x6dc5e8,
    metalness:.2,
    roughness:.2
  });

  const win1 =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2,
      1.5,
      .12
    ),
    windowMaterial
  );

  win1.position.set(
    -w*.25,
    h*.55,
    d/2+.08
  );

  group.add(win1);

  const win2 =
  win1.clone();

  win2.position.x =
  w*.25;

  group.add(win2);

  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);

  window.buildingColliders.push({
    minX:x-w/2,
    maxX:x+w/2,
    minZ:z-d/2,
    maxZ:z+d/2
  });
}

/* HOUSES */

createHouse(-25,-18,14,12,7);
createHouse(25,-18,14,12,7);
createHouse(-25,20,16,13,8);
createHouse(25,20,16,13,8);

/* FACTORY */

function createFactory(){

  const x=-32;
  const z=48;
  const w=28;
  const d=18;
  const h=12;

  const factory =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color:0x777777
    })
  );

  factory.position.set(
    x,
    h/2,
    z
  );

  scene.add(factory);

  const roof =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w+2,
      1,
      d+2
    ),
    new THREE.MeshStandardMaterial({
      color:0x444444
    })
  );

  roof.position.set(
    x,
    h+.5,
    z
  );

  scene.add(roof);

  window.buildingColliders.push({
    minX:x-w/2,
    maxX:x+w/2,
    minZ:z-d/2,
    maxZ:z+d/2
  });
}

createFactory();

/* CLOCK TOWER */

function createClockTower(){

  const x=42;
  const z=42;

  const tower =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8,
      24,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0xb7b7b7
    })
  );

  tower.position.set(
    x,
    12,
    z
  );

  scene.add(tower);

  const roof =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      6,
      6,
      4
    ),
    new THREE.MeshStandardMaterial({
      color:0x59352a
    })
  );

  roof.position.set(
    x,
    27,
    z
  );

  scene.add(roof);

  const clock =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      2.3,
      2.3,
      .25,
      32
    ),
    new THREE.MeshStandardMaterial({
      color:0xf4e7bd
    })
  );

  clock.rotation.x =
  Math.PI/2;

  clock.position.set(
    x,
    18,
    z-4.1
  );

  scene.add(clock);

  window.buildingColliders.push({
    minX:x-4,
    maxX:x+4,
    minZ:z-4,
    maxZ:z+4
  });
}

createClockTower();

/* WATER */

const water =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    32,
    22
  ),
  new THREE.MeshStandardMaterial({
    color:0x268bc2,
    transparent:true,
    opacity:.78,
    roughness:.15,
    metalness:.1
  })
);

water.rotation.x =
-Math.PI/2;

water.position.set(
  -35,
  .08,
  -38
);

scene.add(water);

/* TREES */

function createTree(
  x,
  z
){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,
      .5,
      3,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x6b3f20
    })
  );

  trunk.position.set(
    x,
    1.5,
    z
  );

  scene.add(trunk);

  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      2,
      12,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x218c35
    })
  );

  leaves.position.set(
    x,
    4,
    z
  );

  scene.add(leaves);
}

for(
  let x=-70;
  x<=70;
  x+=14
){

  createTree(
    x,
    -70
  );

  createTree(
    x,
    70
  );
}

for(
  let z=-55;
  z<=55;
  z+=14
){

  createTree(
    -70,
    z
  );

  createTree(
    70,
    z
  );
}

/* PLAYER */

const player =
new THREE.Group();

/* BODY */

const body =
new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .48,
    1.15,
    8,
    16
  ),
  new THREE.MeshStandardMaterial({
    color:0x235fba
  })
);

body.position.y=1.65;

player.add(body);

/* HEAD */

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .43,
    20,
    20
  ),
  new THREE.MeshStandardMaterial({
    color:0xd89a70
  })
);

head.position.y=2.95;

player.add(head);

/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x20252b
});

const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .30,
    1.25,
    .36
  ),
  legMaterial
);

leftLeg.position.set(
  -.23,
  .62,
  0
);

player.add(leftLeg);

const rightLeg =
leftLeg.clone();

rightLeg.position.x=.23;

player.add(rightLeg);

/* ARMS */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x235fba
});

const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,
    1.2,
    .28
  ),
  armMaterial
);

leftArm.position.set(
  -.68,
  1.8,
  0
);

player.add(leftArm);

const rightArm =
leftArm.clone();

rightArm.position.x=.68;

player.add(rightArm);

player.position.set(
  0,
  0,
  8
);

scene.add(player);

/* EXPORT */

window.gameScene=scene;
window.gameCamera=camera;
window.gameRenderer=renderer;
window.gamePlayer=player;

window.gameParts={
  leftLeg,
  rightLeg,
  leftArm,
  rightArm,
  body,
  head
};

/* RESIZE */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* LOAD GAME.JS */

const script =
document.createElement("script");

script.src="game.js";

script.onload=()=>{
  document.getElementById(
    "loading"
  ).style.display="none";
};

script.onerror=()=>{
  document.getElementById(
    "loading"
  ).textContent=
  "game.js not found";
};

document.body.appendChild(script);

/* RENDER */

function render(){

  requestAnimationFrame(render);

  renderer.render(
    scene,
    camera
  );
}

render();

</script>

</body>
</html>
