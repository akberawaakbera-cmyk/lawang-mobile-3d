<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101820;
  color:white;
  font-size:20px;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:10px;
  display:none;
}

#lobby{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:35px;
  background:linear-gradient(
    transparent 45%,
    rgba(0,0,0,.7)
  );
}

#title{
  position:absolute;
  top:35px;
  color:white;
  font-size:32px;
  font-weight:bold;
  text-shadow:0 3px 10px #000;
}

#subtitle{
  position:absolute;
  top:75px;
  color:#ddd;
}

.menu{
  width:90%;
  max-width:400px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu button{
  height:58px;
  border:0;
  border-radius:14px;
  color:white;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.25);
  font-size:16px;
  font-weight:bold;
}

.menu button:first-child{
  grid-column:1/3;
  background:#2388ff;
  font-size:20px;
}

#gameUI{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  pointer-events:none;
}

.gameButton{
  position:absolute;
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:white;
  font-weight:bold;
  background:rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.45);
  user-select:none;
}

#fire{
  right:25px;
  bottom:35px;
  width:90px;
  height:90px;
  background:rgba(210,45,45,.5);
}

#jump{
  right:135px;
  bottom:45px;
  width:65px;
  height:65px;
}

#reload{
  right:145px;
  bottom:125px;
  width:58px;
  height:58px;
  font-size:11px;
}

#gun{
  right:35px;
  bottom:145px;
  width:65px;
  height:65px;
  font-size:12px;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:30px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.35);
  pointer-events:auto;
}

#knob{
  position:absolute;
  width:60px;
  height:60px;
  left:40px;
  top:40px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  border:2px solid white;
}

#panel{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}

.box{
  width:88%;
  max-width:400px;
  background:#17212b;
  color:white;
  padding:25px;
  border-radius:18px;
  text-align:center;
}

.box button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#2388ff;
  color:white;
  font-size:16px;
}

.close{
  background:#444!important;
}

#mission{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  z-index:400;
  color:white;
  background:rgba(0,0,0,.6);
  padding:12px;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<canvas id="game"></canvas>

<div id="title">
  LAWANG MOBILE
</div>

<div id="subtitle">
  3D ONLINE ACTION
</div>

<!-- LOBBY -->
<div id="lobby">

  <div class="menu">

    <button id="playButton">
      ▶ PLAY
    </button>

    <button id="mapButton">
      🗺 MAP
    </button>

    <button id="gunButton">
      🔫 GUN
    </button>

    <button id="skinButton">
      👕 SKINS
    </button>

    <button id="settingsButton">
      ⚙ SETTINGS
    </button>

  </div>

</div>

<!-- GAME HUD -->
<div id="hud">
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weapon">PISTOL</span><br>
  Score: <span id="score">0</span>
</div>

<div id="mission">
  🎯 MISSION<br>
  Eliminate the enemies
</div>

<!-- GAME CONTROLS -->
<div id="gameUI">

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="fire" class="gameButton">
    FIRE
  </div>

  <div id="jump" class="gameButton">
    JUMP
  </div>

  <div id="reload" class="gameButton">
    RELOAD
  </div>

  <div id="gun" class="gameButton">
    GUN
  </div>

</div>

<!-- PANEL -->
<div id="panel">

  <div class="box">

    <h2 id="panelTitle">
      LAWANG MOBILE
    </h2>

    <div id="panelContent">
      Select an option
    </div>

    <button id="panelAction">
      OK
    </button>

    <button class="close" id="closePanel">
      CLOSE
    </button>

  </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);

const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    .1,
    1000
  );

camera.position.set(
  0,
  4,
  8
);

const renderer =
  new THREE.WebGLRenderer({
    canvas:document.getElementById("game"),
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x444444,
    2
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  20,
  30,
  10
);

scene.add(sun);


/* =========================
   GROUND
========================= */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      150,
      150
    ),
    new THREE.MeshStandardMaterial({
      color:0x3f823f
    })
  );

ground.rotation.x =
  -Math.PI/2;

scene.add(ground);


/* =========================
   ROAD
========================= */

function makeRoad(
  x,
  z,
  w,
  d
){

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        .08,
        d
      ),
      new THREE.MeshStandardMaterial({
        color:0x303030
      })
    );

  road.position.set(
    x,
    .04,
    z
  );

  scene.add(road);
}

makeRoad(0,0,100,10);
makeRoad(0,25,10,50);
makeRoad(0,-25,10,50);


/* =========================
   BUILDINGS
========================= */

function building(
  x,
  z,
  w,
  h,
  d
){

  const b =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:0xb5b5b5
      })
    );

  b.position.set(
    x,
    h/2,
    z
  );

  scene.add(b);
}

building(-18,-15,12,8,10);
building(18,-15,12,10,10);
building(-20,18,10,7,10);
building(20,18,12,9,10);
building(-35,0,8,6,12);
building(35,0,8,8,12);


/* =========================
   TREES
========================= */

function tree(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .35,.45,3,8
      ),
      new THREE.MeshStandardMaterial({
        color:0x704020
      })
    );

  trunk.position.set(
    x,1.5,z
  );

  scene.add(trunk);

  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        2,12,12
      ),
      new THREE.MeshStandardMaterial({
        color:0x218c35
      })
    );

  leaves.position.set(
    x,4,z
  );

  scene.add(leaves);
}

[
 [-8,-8],
 [8,-8],
 [-8,8],
 [8,8],
 [-30,-20],
 [30,-20],
 [-30,20],
 [30,20]
].forEach(p =>
  tree(p[0],p[1])
);


/* =========================
   CHARACTER
========================= */

const player =
  new THREE.Group();

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1,1.7,.6
    ),
    new THREE.MeshStandardMaterial({
      color:0x2388ff
    })
  );

body.position.y=2;

player.add(body);

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .45,20,20
    ),
    new THREE.MeshStandardMaterial({
      color:0xf0b48a
    })
  );

head.position.y=3.15;

player.add(head);


/* LEGS */

const legMaterial =
  new THREE.MeshStandardMaterial({
    color:0x202020
  });

const leftLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .28,1.2,.35
    ),
    legMaterial
  );

leftLeg.position.set(
  -.22,.6,0
);

player.add(leftLeg);

const rightLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .28,1.2,.35
    ),
    legMaterial
  );

rightLeg.position.set(
  .22,.6,0
);

player.add(rightLeg);


/* ARMS */

const armMaterial =
  new THREE.MeshStandardMaterial({
    color:0x2388ff
  });

const leftArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .25,1.2,.25
    ),
    armMaterial
  );

leftArm.position.set(
  -.7,2,0
);

player.add(leftArm);

const rightArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .25,1.2,.25
    ),
    armMaterial
  );

rightArm.position.set(
  .7,2,0
);

player.add(rightArm);

player.position.set(
  0,0,5
);

scene.add(player);


/* =========================
   GAME OBJECTS
========================= */

window.gameScene=scene;
window.gameCamera=camera;
window.gameRenderer=renderer;
window.gamePlayer=player;

window.gameParts={
  body,
  head,
  leftLeg,
  rightLeg,
  leftArm,
  rightArm
};


/* =========================
   LOBBY CAMERA
========================= */

let gameStarted=false;

function lobbyCamera(){

  const time =
    performance.now()*0.0003;

  camera.position.x =
    Math.sin(time)*8;

  camera.position.z =
    9;

  camera.position.y =
    4.2;

  camera.lookAt(
    player.position.x,
    2,
    player.position.z
  );
}


/* =========================
   START GAME
========================= */

function startGame(){

  gameStarted=true;

  document.getElementById(
    "lobby"
  ).style.display="none";

  document.getElementById(
    "title"
  ).style.display="none";

  document.getElementById(
    "subtitle"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="block";

  document.getElementById(
    "gameUI"
  ).style.display="block";

  document.getElementById(
    "mission"
  ).style.display="block";
}


/* =========================
   MENU
========================= */

const panel =
  document.getElementById(
    "panel"
  );

const panelTitle =
  document.getElementById(
    "panelTitle"
  );

const panelContent =
  document.getElementById(
    "panelContent"
  );

function openPanel(
  title,
  content
){

  panelTitle.textContent=title;
  panelContent.innerHTML=content;
  panel.style.display="flex";
}

document.getElementById(
  "playButton"
).onclick=startGame;

document.getElementById(
  "mapButton"
).onclick=() =>
  openPanel(
    "MAP",
    "🏙 CITY MAP<br><br>Buildings • Roads • Trees • Houses"
  );

document.getElementById(
  "gunButton"
).onclick=() =>
  openPanel(
    "GUN",
    "🔫 PISTOL<br><br>RIFLE<br><br>SHOTGUN"
  );

document.getElementById(
  "skinButton"
).onclick=() =>
  openPanel(
    "SKINS",
    "👕 DEFAULT<br><br>DESERT<br><br>TACTICAL"
  );

document.getElementById(
  "settingsButton"
).onclick=() =>
  openPanel(
    "SETTINGS",
    "Graphics: HIGH<br><br>Controls: CUSTOM<br><br>Camera: THIRD PERSON"
  );

document.getElementById(
  "closePanel"
).onclick=() =>
  panel.style.display="none";

document.getElementById(
  "panelAction"
).onclick=() =>
  panel.style.display="none";


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================
   LOADING
========================= */

setTimeout(() => {

  document.getElementById(
    "loading"
  ).style.display="none";

},700);


/* =========================
   RENDER
========================= */

function render(){

  requestAnimationFrame(render);

  if(!gameStarted){

    lobbyCamera();

  }

  renderer.render(
    scene,
    camera
  );
}

render();

</script>

<!-- IMPORTANT:
     game.js will be loaded after
     the 3D objects are ready.
-->

<script src="game.js"></script>

</body>
</html>
