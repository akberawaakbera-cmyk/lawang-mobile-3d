<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no"
>

<title>LAWANG MOBILE 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#game {
  width: 100vw;
  height: 100vh;
  display: block;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #101820;
  color: white;

  font-family: Arial, sans-serif;
  font-size: 22px;
}

#info {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 10;

  color: white;
  background: rgba(0,0,0,0.5);

  padding: 10px 14px;
  border-radius: 10px;

  font-family: Arial, sans-serif;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<div id="info">
  LAWANG MOBILE<br>
  3D TEST WORLD
</div>

<canvas id="game"></canvas>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ============================
// SCENE
// ============================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);


// ============================
// CAMERA
// ============================

const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );

camera.position.set(
  0,
  4,
  8
);


// ============================
// RENDERER
// ============================

const canvas =
  document.getElementById("game");

const renderer =
  new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


// ============================
// LIGHT
// ============================

const sunlight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sunlight.position.set(
  10,
  20,
  10
);

scene.add(sunlight);


const ambient =
  new THREE.AmbientLight(
    0xffffff,
    0.7
  );

scene.add(ambient);


// ============================
// GROUND
// ============================

const groundGeometry =
  new THREE.PlaneGeometry(
    100,
    100
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x3b7d3b
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

scene.add(ground);


// ============================
// ROAD
// ============================

const roadGeometry =
  new THREE.BoxGeometry(
    100,
    0.05,
    8
  );

const roadMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x333333
  });

const road =
  new THREE.Mesh(
    roadGeometry,
    roadMaterial
  );

road.position.y = 0.03;

scene.add(road);


// ============================
// BUILDING
// ============================

function createBuilding(
  x,
  z,
  width,
  height,
  depth
) {

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      depth
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xb8b8b8
    });

  const building =
    new THREE.Mesh(
      geometry,
      material
    );

  building.position.set(
    x,
    height / 2,
    z
  );

  scene.add(building);
}


// Buildings

createBuilding(
  -15,
  -12,
  10,
  7,
  8
);

createBuilding(
  15,
  -12,
  12,
  9,
  9
);

createBuilding(
  -18,
  15,
  8,
  6,
  10
);

createBuilding(
  18,
  15,
  10,
  8,
  8
);


// ============================
// TREES
// ============================

function createTree(
  x,
  z
) {

  const trunkGeometry =
    new THREE.CylinderGeometry(
      0.35,
      0.45,
      3,
      8
    );

  const trunkMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x6b3f20
    });

  const trunk =
    new THREE.Mesh(
      trunkGeometry,
      trunkMaterial
    );

  trunk.position.set(
    x,
    1.5,
    z
  );

  scene.add(trunk);


  const leavesGeometry =
    new THREE.SphereGeometry(
      1.8,
      12,
      12
    );

  const leavesMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x218c35
    });

  const leaves =
    new THREE.Mesh(
      leavesGeometry,
      leavesMaterial
    );

  leaves.position.set(
    x,
    4,
    z
  );

  scene.add(leaves);
}


// Trees

createTree(-8, -8);
createTree(8, -8);
createTree(-8, 8);
createTree(8, 8);
createTree(-25, 0);
createTree(25, 0);


// ============================
// PLAYER TEST CHARACTER
// ============================

const player =
  new THREE.Group();


// Body

const bodyGeometry =
  new THREE.BoxGeometry(
    1,
    1.7,
    0.6
  );

const bodyMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x2388ff
  });

const body =
  new THREE.Mesh(
    bodyGeometry,
    bodyMaterial
  );

body.position.y = 2;

player.add(body);


// Head

const headGeometry =
  new THREE.SphereGeometry(
    0.45,
    20,
    20
  );

const headMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xf0b48a
  });

const head =
  new THREE.Mesh(
    headGeometry,
    headMaterial
  );

head.position.y = 3.15;

player.add(head);


// Player position

player.position.set(
  0,
  0,
  5
);

scene.add(player);


// ============================
// RESIZE
// ============================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ============================
// START
// ============================

document.getElementById(
  "loading"
).style.display = "none";


// ============================
// ANIMATION
// ============================

function animate() {

  requestAnimationFrame(
    animate
  );

  // Camera follows player

  camera.position.x =
    player.position.x;

  camera.position.z =
    player.position.z + 8;

  camera.lookAt(
    player.position.x,
    2,
    player.position.z
  );

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>

</body>
</html>
