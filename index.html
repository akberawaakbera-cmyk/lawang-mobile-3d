<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">
<title>LAWANG MOBILE 3D</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#78b8e8;
  touch-action:none;
  font-family:Arial,sans-serif;
}
#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}
/* HUD */
#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.58);
  padding:10px 14px;
  border-radius:12px;
  pointer-events:none;
  line-height:1.5;
}
#title{
  font-weight:bold;
  font-size:16px;
}
/* CAMERA */
#cameraArea{
  position:fixed;
  left:30%;
  top:0;
  width:70%;
  height:75%;
  z-index:150;
  touch-action:none;
}
/* JOYSTICK */
#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);
  z-index:300;
  touch-action:none;
}
#joystickKnob{
  position:absolute;
  width:62px;
  height:62px;
  left:50%;
  top:50%;
  margin-left:-31px;
  margin-top:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.7);
}
/* STATUS */
#status{
  position:fixed;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:400;
  color:white;
  background:rgba(0,0,0,.5);
  padding:6px 14px;
  border-radius:9px;
  font-size:12px;
  pointer-events:none;
}
/* LOBBY */
#lobbyText{
  position:fixed;
  left:50%;
  top:70px;
  transform:translateX(-50%);
  z-index:100;
  color:white;
  text-align:center;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}
#lobbyText h2{
  margin:0 0 5px;
}
/* LOADING */
#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#08111c;
  color:white;
  font-size:21px;
  font-weight:bold;
  text-align:center;
}
/* BATTLE PANEL */
#battlePanel{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.8);
  align-items:center;
  justify-content:center;
}
#battleBox{
  width:85%;
  max-width:380px;
  padding:25px;
  border-radius:18px;
  background:#101923;
  color:white;
  text-align:center;
}
#battleBox button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#2388ff;
  color:white;
  font-weight:bold;
  font-size:15px;
}
/* CROSSHAIR */
#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:28px;
  font-weight:bold;
  z-index:120;
  pointer-events:none;
}
/* MOBILE */
@media(max-width:600px){
  #hud{
    top:10px;
    left:10px;
    font-size:12px;
  }
  #lobbyText{
    top:65px;
  }
}
</style>
</head>
<body>
<!-- GAME CANVAS -->
<canvas id="game"></canvas>
<!-- HUD -->
<div id="hud">
  <div id="title">
    LAWANG MOBILE 3D
  </div>
  HP:
  <span id="hp">100</span>
  <br>
  Weapon:
  <span id="weapon">PISTOL</span>
  <br>
  Ammo:
  <span id="ammo">12/12</span>
  <br>
  Kills:
  <span id="kills">0</span>
  <br>
  Score:
  <span id="score">0</span>
</div>
<!-- LOBBY TITLE -->
<div id="lobbyText">
  <h2>LAWANG MOBILE</h2>
  <div>
    3D BATTLE WORLD
  </div>
</div>
<!-- CAMERA TOUCH AREA -->
<div id="cameraArea"></div>
<!-- JOYSTICK -->
<div id="joystick">
  <div id="joystickKnob"></div>
</div>
<!-- CROSSHAIR -->
<div id="crosshair">
  +
</div>
<!-- STATUS -->
<div id="status">
  LOBBY READY
</div>
<!-- BATTLE MENU -->
<div id="battlePanel">
  <div id="battleBox">
    <h2>
      LAWANG MOBILE
    </h2>
    <p>
      Battle Royale
    </p>
    <button id="planeButton">
      ✈️ ENTER AIRCRAFT
    </button>
    <button id="closeBattle">
      BACK TO LOBBY
    </button>
  </div>
</div>
<!--
=========================================================
THREE.JS ENGINE
=========================================================
-->
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
/* ======================================================
   GLOBAL THREE
====================================================== */
window.THREE = THREE;
/* ======================================================
   CANVAS
====================================================== */
const canvas =
document.getElementById("game");
/* ======================================================
   SCENE
====================================================== */
const scene =
new THREE.Scene();
window.gameScene =
scene;
scene.background =
new THREE.Color(0x78b8e8);
scene.fog =
new THREE.Fog(
  0x78b8e8,
  40,
  130
);
/* ======================================================
   CAMERA
====================================================== */
const camera =
new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  500
);
camera.position.set(
  0,
  4,
  8
);
window.gameCamera =
camera;
/* ======================================================
   RENDERER
====================================================== */
const renderer =
new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);
renderer.setSize(
  innerWidth,
  innerHeight
);
window.gameRenderer =
renderer;
/* ======================================================
   LIGHTING
====================================================== */
const sun =
new THREE.DirectionalLight(
  0xffffff,
  2.2
);
sun.position.set(
  25,
  40,
  15
);
scene.add(sun);
const ambient =
new THREE.HemisphereLight(
  0xffffff,
  0x445566,
  1.2
);
scene.add(ambient);
/* ======================================================
   GROUND
====================================================== */
const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    120,
    120
  ),
  new THREE.MeshStandardMaterial({
    color:0x477d3c,
    roughness:0.9
  })
);
ground.rotation.x =
-Math.PI / 2;
scene.add(ground);
/* ======================================================
   LOBBY FLOOR
====================================================== */
const floor =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    15,
    15,
    0.3,
    48
  ),
  new THREE.MeshStandardMaterial({
    color:0x666b72,
    roughness:0.8
  })
);
floor.position.y =
-0.15;
scene.add(floor);
/* ======================================================
   BUILDINGS
====================================================== */
function makeBuilding(
  x,
  z,
  w,
  h,
  d
){
  const building =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      h,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0xb5b0a5,
      roughness:0.8
    })
  );
  building.position.set(
    x,
    h / 2,
    z
  );
  scene.add(
    building
  );
}
makeBuilding(
  -22,
  -15,
  14,
  8,
  12
);
makeBuilding(
  22,
  -15,
  14,
  10,
  12
);
makeBuilding(
  -25,
  20,
  16,
  7,
  14
);
makeBuilding(
  25,
  20,
  16,
  9,
  14
);
/* ======================================================
   TREES
====================================================== */
function makeTree(
  x,
  z
){
  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.3,
      0.45,
      3,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x704522
    })
  );
  trunk.position.set(
    x,
    1.5,
    z
  );
  scene.add(
    trunk
  );
  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.7,
      12,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x257d32
    })
  );
  leaves.position.set(
    x,
    4,
    z
  );
  scene.add(
    leaves
  );
}
[
  [-10,-12],
  [10,-12],
  [-10,12],
  [10,12],
  [-30,0],
  [30,0]
].forEach(
  p => makeTree(
    p[0],
    p[1]
  )
);
/* ======================================================
   LAWANG CHARACTER
   ====================================================== */
const player =
new THREE.Group();
player.name =
"LAWANG_PLAYER";
player.position.set(
  0,
  0,
  5
);
scene.add(
  player
);
window.gamePlayer =
player;
/* CHARACTER PARTS */
const parts = {};
window.gameParts =
parts;
/* ======================================================
   SKIN
   Medium skin tone
====================================================== */
const skinMaterial =
new THREE.MeshStandardMaterial({
  color:0xc98f6b,
  roughness:0.75
});
/* ======================================================
   BLACK JACKET
====================================================== */
const jacketMaterial =
new THREE.MeshStandardMaterial({
  color:0x111318,
  roughness:0.55,
  metalness:0.05
});
const body =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1.05,
    1.65,
    0.62
  ),
  jacketMaterial
);
body.position.y =
2.0;
player.add(
  body
);
parts.body =
body;
/* ======================================================
   NECK
====================================================== */
const neck =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    0.18,
    0.2,
    0.28,
    16
  ),
  skinMaterial
);
neck.position.y =
2.88;
player.add(
  neck
);
/* ======================================================
   HEAD
====================================================== */
const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    0.48,
    24,
    20
  ),
  skinMaterial
);
head.scale.set(
  0.92,
  1.08,
  0.9
);
head.position.y =
3.35;
player.add(
  head
);
parts.head =
head;
/* ======================================================
   BLACK HAIR
====================================================== */
const hairMaterial =
new THREE.MeshStandardMaterial({
  color:0x090909,
  roughness:0.7
});
const hair =
new THREE.Mesh(
  new THREE.SphereGeometry(
    0.5,
    24,
    16,
    0,
    Math.PI * 2,
    0,
    Math.PI * 0.48
  ),
  hairMaterial
);
hair.scale.set(
  1,
  0.9,
  1
);
hair.position.y =
3.55;
player.add(
  hair
);
parts.hair =
hair;
/* ======================================================
   EYES — CHOCOLATE COLOR
====================================================== */
const eyeMaterial =
new THREE.MeshStandardMaterial({
  color:0x3b2115,
  roughness:0.25
});
function createEye(
  x
){
  const eye =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.055,
      12,
      12
    ),
    eyeMaterial
  );
  eye.position.set(
    x,
    3.38,
    -0.435
  );
  player.add(
    eye
  );
  return eye;
}
parts.leftEye =
createEye(-0.17);
parts.rightEye =
createEye(0.17);
/* ======================================================
   NO BEARD
====================================================== */
/* ======================================================
   BLACK PANTS
====================================================== */
const pantsMaterial =
new THREE.MeshStandardMaterial({
  color:0x090b0f,
  roughness:0.7
});
const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.30,
    1.2,
    0.36
  ),
  pantsMaterial
);
leftLeg.position.set(
  -0.23,
  0.6,
  0
);
player.add(
  leftLeg
);
parts.leftLeg =
leftLeg;
const rightLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.30,
    1.2,
    0.36
  ),
  pantsMaterial
);
rightLeg.position.set(
  0.23,
  0.6,
  0
);
player.add(
  rightLeg
);
parts.rightLeg =
rightLeg;
/* ======================================================
   BLACK SHOES
====================================================== */
const shoeMaterial =
new THREE.MeshStandardMaterial({
  color:0x050505,
  roughness:0.55
});
const leftShoe =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.34,
    0.18,
    0.55
  ),
  shoeMaterial
);
leftShoe.position.set(
  -0.23,
  0.09,
  -0.08
);
player.add(
  leftShoe
);
const rightShoe =
leftShoe.clone();
rightShoe.position.x =
0.23;
player.add(
  rightShoe
);
/* ======================================================
   ARMS
====================================================== */
const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.27,
    1.18,
    0.27
  ),
  jacketMaterial
);
leftArm.position.set(
  -0.68,
  2.0,
  0
);
player.add(
  leftArm
);
parts.leftArm =
leftArm;
const rightArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.27,
    1.18,
    0.27
  ),
  jacketMaterial
);
rightArm.position.set(
  0.68,
  2.0,
  0
);
player.add(
  rightArm
);
parts.rightArm =
rightArm;
/* ======================================================
   HANDS
====================================================== */
const leftHand =
new THREE.Mesh(
  new THREE.SphereGeometry(
    0.16,
    12,
    12
  ),
  skinMaterial
);
leftHand.position.set(
  -0.68,
  1.38,
  0
);
player.add(
  leftHand
);
const rightHand =
leftHand.clone();
rightHand.position.x =
0.68;
player.add(
  rightHand
);
/* ======================================================
   SIMPLE GUN
====================================================== */
const gun =
new THREE.Group();
const gunBody =
new THREE.Mesh(
  new THREE.BoxGeometry(
    0.18,
    0.25,
    1.1
  ),
  new THREE.MeshStandardMaterial({
    color:0x202020,
    metalness:0.7,
    roughness:0.3
  })
);
gun.add(
  gunBody
);
const barrel =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    0.055,
    0.055,
    0.55,
    10
  ),
  new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:0.8
  })
);
barrel.rotation.x =
Math.PI / 2;
barrel.position.z =
-0.7;
gun.add(
  barrel
);
gun.position.set(
  0.48,
  1.9,
  -0.45
);
gun.rotation.x =
-0.15;
player.add(
  gun
);
/* ======================================================
   HANDLE RESIZE
====================================================== */
function resize(){
  camera.aspect =
    innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(
    innerWidth,
    innerHeight
  );
}
window.addEventListener(
  "resize",
  resize
);
resize();
/* ======================================================
   START GAME.JS
====================================================== */
window.gameReady =
true;
/*
  game.js will take over
  the actual movement,
  camera, aircraft,
  weapons, enemies,
  joystick and game loop.
*/
const loading =
document.getElementById(
  "loading"
);
if(loading){
  loading.style.display =
    "none";
}
/* ======================================================
   LOAD GAME.JS — ONLY ONCE
====================================================== */
const script =
document.createElement(
  "script"
);
script.type =
  "module";
script.src =
  "./game.js";
document.body.appendChild(
  script
);
/* ======================================================
   AIRCRAFT BUTTON
====================================================== */
document.getElementById(
  "planeButton"
).addEventListener(
  "click",
  () => {
    document.getElementById(
      "battlePanel"
    ).style.display =
      "none";
    if(
      window.lawangStartAircraft
    ){
      window.lawangStartAircraft();
    }else{
      console.warn(
        "LAWANG: game.js ابھی load ہو رہا ہے..."
      );
      setTimeout(
        () => {
          if(
            window.lawangStartAircraft
          ){
            window.lawangStartAircraft();
          }
        },
        500
      );
    }
  }
);
/* ======================================================
   BATTLE MENU
====================================================== */
document.getElementById(
  "closeBattle"
).addEventListener(
  "click",
  () => {
    document.getElementById(
      "battlePanel"
    ).style.display =
      "none";
  }
);
</script>
</body>
</html>
