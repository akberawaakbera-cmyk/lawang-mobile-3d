<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* LOADING */
#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#071018;
  color:white;
  font-size:20px;
}

/* LOBBY */
#lobby{
  position:fixed;
  inset:0;
  z-index:500;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:25px;
  pointer-events:none;
}

#logo{
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 3px 12px #000;
}

#lobbyPanel{
  width:min(420px,90vw);
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  pointer-events:auto;
}

.menuButton{
  width:100%;
  padding:15px;
  margin:6px 0;
  border:0;
  border-radius:12px;
  color:white;
  background:#2388ff;
  font-size:16px;
  font-weight:bold;
}

.menuButton.secondary{
  background:rgba(255,255,255,.15);
}

#selectedInfo{
  text-align:center;
  margin-bottom:8px;
}

/* HUD */
#hud{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.5);
  padding:10px 14px;
  border-radius:10px;
  line-height:1.6;
  pointer-events:none;
}

/* CONTROLS */
#controls{
  display:none;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.35);
  z-index:200;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  margin:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  border:2px solid rgba(255,255,255,.7);
  pointer-events:none;
}

.controlButton{
  position:fixed;
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.15);
  color:white;
  font-weight:bold;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
}

#fire{
  right:25px;
  bottom:30px;
  width:88px;
  height:88px;
  background:rgba(220,40,40,.55);
}

#jump{
  right:135px;
  bottom:35px;
}

#reload{
  right:145px;
  bottom:115px;
  width:60px;
  height:60px;
  font-size:11px;
}

#gun{
  right:35px;
  bottom:145px;
  font-size:12px;
}

#run{
  left:180px;
  bottom:35px;
  font-size:12px;
}

#status{
  position:fixed;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.45);
  padding:5px 10px;
  border-radius:8px;
  z-index:300;
  font-size:12px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:800;
  background:rgba(0,0,0,.78);
  align-items:center;
  justify-content:center;
  color:white;
}

.modalBox{
  width:min(420px,90vw);
  max-height:85vh;
  overflow:auto;
  background:#15202b;
  border-radius:20px;
  padding:20px;
}

.modalBox h2{
  margin-top:0;
}

.option{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:0;
  border-radius:10px;
  color:white;
  background:#26384a;
  font-size:15px;
}

.option.selected{
  background:#2388ff;
}

.close{
  background:#555;
}

.settingRow{
  margin:12px 0;
}

select{
  width:100%;
  padding:12px;
  border-radius:9px;
  background:#26384a;
  color:white;
  border:0;
}

/* AIM */
#crosshair{
  display:none;
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:25px;
  height:25px;
  z-index:150;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:25px;
  height:2px;
  top:11px;
}

#crosshair:after{
  width:2px;
  height:25px;
  left:11px;
}
</style>
</head>

<body>

<div id="loading">Loading LAWANG MOBILE 3D...</div>

<canvas id="game"></canvas>

<!-- LOBBY -->
<div id="lobby">

  <div id="logo">LAWANG MOBILE</div>

  <div id="lobbyPanel">

    <div id="selectedInfo">
      CHARACTER: <b id="characterName">SOLDIER</b><br>
      WEAPON: <b id="weaponName">PISTOL</b>
    </div>

    <button class="menuButton" id="playButton">
      ▶ PLAY
    </button>

    <button class="menuButton secondary" id="characterButton">
      👤 CHARACTER
    </button>

    <button class="menuButton secondary" id="weaponButton">
      🔫 WEAPONS
    </button>

    <button class="menuButton secondary" id="modeButton">
      🎮 GAME MODE
    </button>

    <button class="menuButton secondary" id="settingsButton">
      ⚙ SETTINGS
    </button>

  </div>
</div>

<!-- HUD -->
<div id="hud">
  <b>LAWANG MOBILE</b><br>
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weaponHUD">PISTOL</span><br>
  Ammo: <span id="ammo">12</span>/<span id="maxAmmo">12</span><br>
  Kills: <span id="kills">0</span>
</div>

<div id="crosshair"></div>

<!-- GAME CONTROLS -->
<div id="controls">

  <div id="joystick">
    <div id="joystickKnob"></div>
  </div>

  <div class="controlButton" id="run">
    RUN
  </div>

  <div class="controlButton" id="jump">
    JUMP
  </div>

  <div class="controlButton" id="reload">
    RELOAD
  </div>

  <div class="controlButton" id="gun">
    GUN
  </div>

  <div class="controlButton" id="fire">
    FIRE
  </div>

</div>

<div id="status">LOBBY</div>

<!-- CHARACTER MODAL -->
<div class="modal" id="characterModal">
  <div class="modalBox">
    <h2>Character</h2>

    <button class="option" data-character="SOLDIER">
      🪖 SOLDIER
    </button>

    <button class="option" data-character="COMMANDO">
      🎖 COMMANDO
    </button>

    <button class="option" data-character="SCOUT">
      🥷 SCOUT
    </button>

    <button class="option close">
      CLOSE
    </button>
  </div>
</div>

<!-- WEAPON MODAL -->
<div class="modal" id="weaponModal">
  <div class="modalBox">
    <h2>Weapons</h2>

    <button class="option" data-weapon="PISTOL">
      🔫 PISTOL
    </button>

    <button class="option" data-weapon="RIFLE">
      🔥 RIFLE
    </button>

    <button class="option" data-weapon="SHOTGUN">
      💥 SHOTGUN
    </button>

    <button class="option close">
      CLOSE
    </button>
  </div>
</div>

<!-- MODE MODAL -->
<div class="modal" id="modeModal">
  <div class="modalBox">
    <h2>Game Mode</h2>

    <button class="option" id="trainingMode">
      🎯 TRAINING
    </button>

    <button class="option" id="battleMode">
      ⚔ BATTLE
    </button>

    <button class="option close">
      CLOSE
    </button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modalBox">

    <h2>Settings</h2>

    <div class="settingRow">
      Graphics
      <select id="graphics">
        <option>LOW</option>
        <option selected>MEDIUM</option>
        <option>HIGH</option>
      </select>
    </div>

    <div class="settingRow">
      FPS
      <select id="fps">
        <option>30</option>
        <option selected>60</option>
      </select>
    </div>

    <button class="option" id="fullscreenButton">
      ⛶ FULLSCREEN
    </button>

    <button class="option close">
      CLOSE
    </button>

  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x78b9df);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1000
);

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

/* LIGHT */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(20,30,10);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    .7
  )
);

/* GROUND */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(160,160),
  new THREE.MeshStandardMaterial({
    color:0x3e873e
  })
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);

/* ROAD */

const road =
new THREE.Mesh(
  new THREE.BoxGeometry(150,.05,10),
  new THREE.MeshStandardMaterial({
    color:0x303030
  })
);

road.position.y=.03;

scene.add(road);

/* BUILDING */

function createBuilding(x,z,w,h,d){

  const house =
  new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:0xb8a080
    })
  );

  house.position.set(
    x,
    h/2,
    z
  );

  scene.add(house);

}

createBuilding(-20,-18,12,8,10);
createBuilding(20,-18,12,10,10);
createBuilding(-22,18,14,7,12);
createBuilding(22,18,14,9,12);

/* TREES */

function createTree(x,z){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .3,.4,3,8
    ),
    new THREE.MeshStandardMaterial({
      color:0x68401f
    })
  );

  trunk.position.set(x,1.5,z);

  scene.add(trunk);

  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.7,12,12
    ),
    new THREE.MeshStandardMaterial({
      color:0x218c35
    })
  );

  leaves.position.set(x,4,z);

  scene.add(leaves);

}

[
 [-8,-8],
 [8,-8],
 [-8,8],
 [8,8],
 [-30,0],
 [30,0],
 [0,-25],
 [0,25]
].forEach(
 p=>createTree(p[0],p[1])
);

/* WATER */

const water =
new THREE.Mesh(
  new THREE.PlaneGeometry(18,12),
  new THREE.MeshStandardMaterial({
    color:0x208dcc,
    transparent:true,
    opacity:.8
  })
);

water.rotation.x=-Math.PI/2;
water.position.set(0,.05,-30);

scene.add(water);

/* PLAYER */

const player =
new THREE.Group();

/* BODY */

const body =
new THREE.Mesh(
  new THREE.BoxGeometry(1,1.7,.65),
  new THREE.MeshStandardMaterial({
    color:0x2388ff
  })
);

body.position.y=2;

player.add(body);

/* HEAD */

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(.46,20,20),
  new THREE.MeshStandardMaterial({
    color:0xf0b48a
  })
);

head.position.y=3.15;

player.add(head);

/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x202020
});

const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(.28,1.2,.35),
  legMaterial
);

leftLeg.position.set(-.22,.6,0);

player.add(leftLeg);

const rightLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(.28,1.2,.35),
  legMaterial
);

rightLeg.position.set(.22,.6,0);

player.add(rightLeg);

/* ARMS */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x2388ff
});

const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(.25,1.2,.25),
  armMaterial
);

leftArm.position.set(-.7,2,0);

player.add(leftArm);

const rightArm =
new THREE.Mesh(
  new THREE.BoxGeometry(.25,1.2,.25),
  armMaterial
);

rightArm.position.set(.7,2,0);

player.add(rightArm);

/* GUN */

const gun =
new THREE.Group();

const gunBody =
new THREE.Mesh(
  new THREE.BoxGeometry(.18,.18,.9),
  new THREE.MeshStandardMaterial({
    color:0x171717
  })
);

gunBody.rotation.x=Math.PI/2;

gun.add(gunBody);

const grip =
new THREE.Mesh(
  new THREE.BoxGeometry(.14,.35,.16),
  new THREE.MeshStandardMaterial({
    color:0x111111
  })
);

grip.position.y=-.2;

gun.add(grip);

gun.position.set(
  .55,
  2.15,
  -.55
);

player.add(gun);

player.position.set(0,0,5);

scene.add(player);

/* EXPOSE */

window.gameScene=scene;
window.gameCamera=camera;
window.gameRenderer=renderer;

window.gamePlayer=player;

window.gameParts={
  leftLeg,
  rightLeg,
  leftArm,
  rightArm,
  body,
  head,
  gun
};

/* RESIZE */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* UI */

const lobby=
document.getElementById("lobby");

const controls=
document.getElementById("controls");

const hud=
document.getElementById("hud");

const crosshair=
document.getElementById("crosshair");

const loading=
document.getElementById("loading");

/* MODALS */

function openModal(id){
  document.getElementById(id)
    .style.display="flex";
}

function closeAllModals(){
  document
    .querySelectorAll(".modal")
    .forEach(
      x=>x.style.display="none"
    );
}

document
.getElementById("characterButton")
.onclick=()=>openModal("characterModal");

document
.getElementById("weaponButton")
.onclick=()=>openModal("weaponModal");

document
.getElementById("modeButton")
.onclick=()=>openModal("modeModal");

document
.getElementById("settingsButton")
.onclick=()=>openModal("settingsModal");

document
.querySelectorAll(".close")
.forEach(
  b=>b.onclick=closeAllModals
);

/* CHARACTER */

document
.querySelectorAll("[data-character]")
.forEach(
  button=>{
    button.addEventListener(
      "click",
      ()=>{
        const name=
          button.dataset.character;

        document
          .getElementById(
            "characterName"
          )
          .textContent=name;

        closeAllModals();
      }
    );
  }
);

/* WEAPON */

document
.querySelectorAll("[data-weapon]")
.forEach(
  button=>{
    button.addEventListener(
      "click",
      ()=>{
        const weapon=
          button.dataset.weapon;

        document
          .getElementById(
            "weaponName"
          )
          .textContent=weapon;

        document
          .getElementById(
            "weaponHUD"
          )
          .textContent=weapon;

        closeAllModals();
      }
    );
  }
);

/* GAME MODE */

document
.getElementById("trainingMode")
.onclick=()=>{
  startGame("TRAINING");
};

document
.getElementById("battleMode")
.onclick=()=>{
  startGame("BATTLE");
};

/* PLAY */

document
.getElementById("playButton")
.onclick=()=>{
  startGame("TRAINING");
};

/* START GAME */

window.startGame=function(mode){

  closeAllModals();

  lobby.style.display="none";

  controls.style.display="block";

  hud.style.display="block";

  crosshair.style.display="block";

  document.getElementById("status")
    .textContent=mode;

  window.gameStarted=true;
};

/* FULLSCREEN */

document
.getElementById("fullscreenButton")
.onclick=async()=>{

  try{

    if(document.documentElement.requestFullscreen){
      await document.documentElement
        .requestFullscreen();
    }

  }catch(e){}

};

/* LOADING */

setTimeout(
  ()=>{
    loading.style.display="none";
  },
  700
);

/* RENDER */

function render(){

  requestAnimationFrame(render);

  renderer.render(
    scene,
    camera
  );

}

render();

</script>

<script src="game.js"></script>

</body>
</html>
