<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:12px;
  pointer-events:none;
}

#title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:4px;
}

#menu{
  position:fixed;
  right:15px;
  top:15px;
  z-index:300;
  display:flex;
  gap:8px;
}

.menuBtn,
.actionBtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.55);
  color:white;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
}

.menuBtn{
  min-width:48px;
}

#lobbyText{
  position:fixed;
  left:50%;
  top:70px;
  transform:translateX(-50%);
  color:white;
  z-index:100;
  text-align:center;
  text-shadow:0 2px 6px black;
  pointer-events:none;
}

#lobbyText h2{
  margin:0 0 5px;
}

#cameraArea{
  position:fixed;
  left:30%;
  top:0;
  width:70%;
  height:75%;
  z-index:150;
  touch-action:none;
}

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:145px;
  height:145px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.10);
  z-index:300;
  touch-action:none;
}

#joystickKnob,
#knob{
  position:absolute;
  width:62px;
  height:62px;
  left:50%;
  top:50%;
  margin-left:-31px;
  margin-top:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.65);
}

#actions{
  position:fixed;
  right:20px;
  bottom:25px;
  z-index:250;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.actionBtn{
  min-width:115px;
  text-align:center;
}

#weaponPanel{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:250;
  display:flex;
  gap:8px;
}

.weaponBtn{
  min-width:75px;
  padding:10px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:10px;
  background:rgba(0,0,0,.6);
  color:white;
  font-weight:bold;
}

.weaponBtn.active{
  background:#2388ff;
}

#status{
  position:fixed;
  left:50%;
  bottom:5px;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.45);
  padding:5px 12px;
  border-radius:8px;
  z-index:400;
  font-size:12px;
  pointer-events:none;
}

#battlePanel{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.82);
  color:white;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#battleBox{
  background:#101923;
  padding:25px;
  border-radius:18px;
  width:85%;
  max-width:400px;
}

#battleBox button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#2388ff;
  color:white;
  font-weight:bold;
}

#ammo{
  margin-top:3px;
}

@media(max-width:600px){

  #hud{
    top:10px;
    left:10px;
    font-size:12px;
  }

  #lobbyText{
    top:65px;
  }

  #joystick{
    width:125px;
    height:125px;
    left:18px;
    bottom:18px;
  }

  #weaponPanel{
    bottom:155px;
    max-width:90%;
    overflow-x:auto;
  }

  .weaponBtn{
    min-width:70px;
    font-size:11px;
  }

  #actions{
    right:12px;
    bottom:18px;
  }

  .actionBtn{
    min-width:95px;
    padding:10px;
  }
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->

<div id="hud">

  <div id="title">
    LAWANG MOBILE
  </div>

  HP:
  <span id="hp">100</span>

  <br>

  Weapon:
  <span id="weapon">PISTOL</span>

  <br>

  Ammo:
  <span id="ammo">12/12</span>

  <br>

  Kills:
  <span id="kills">0</span>

  <br>

  Score:
  <span id="score">0</span>

</div>


<!-- LOBBY TITLE -->

<div id="lobbyText">

  <h2>3D LOBBY</h2>

  <div>
    LAWANG MOBILE
  </div>

</div>


<!-- MENU -->

<div id="menu">

  <button
    class="menuBtn"
    id="inventory">
    🎒
  </button>

  <button
    class="menuBtn"
    id="settings">
    ⚙️
  </button>

</div>


<!-- CAMERA TOUCH AREA -->

<div id="cameraArea"></div>


<!-- JOYSTICK -->

<div id="joystick">

  <div id="joystickKnob"></div>

</div>


<!-- BASIC ACTION BUTTONS -->

<div id="actions">

  <button
    class="actionBtn"
    id="jump">
    JUMP
  </button>

  <button
    class="actionBtn"
    id="run">
    RUN
  </button>

  <button
    class="actionBtn"
    id="emote">
    EMOTE
  </button>

  <button
    class="actionBtn"
    id="startBattle">
    ▶ START
  </button>

</div>


<!-- WEAPONS -->

<div id="weaponPanel">

  <button
    class="weaponBtn active"
    data-weapon="PISTOL">
    🔫 PISTOL
  </button>

  <button
    class="weaponBtn"
    data-weapon="RIFLE">
    🔫 RIFLE
  </button>

  <button
    class="weaponBtn"
    data-weapon="SHOTGUN">
    🔫 SHOTGUN
  </button>

</div>


<!-- STATUS -->

<div id="status">
  LOBBY
</div>


<!-- AIRCRAFT / BATTLE PANEL -->

<div id="battlePanel">

  <div id="battleBox">

    <h2>
      LAWANG MOBILE
    </h2>

    <p id="battleMessage">
      Battle Royale
    </p>

    <button id="planeButton">
      ✈️ ENTER AIRCRAFT
    </button>

    <button id="closeBattle">
      BACK TO LOBBY
    </button>

  </div>

</div>


<!-- IMPORTANT:
     ONLY GAME.JS IS LOADED HERE.
     ALL GAME LOGIC IS INSIDE GAME.JS.
-->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;


/* ==============================
   CANVAS
   ============================== */

const canvas =
document.getElementById("game");


/* ==============================
   SCENE
   ============================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x78b8e8);

scene.fog =
new THREE.Fog(
  0x78b8e8,
  35,
  120
);


/* ==============================
   CAMERA
   ============================== */

const camera =
new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  500
);

camera.position.set(
  0,
  4,
  8
);


/* ==============================
   RENDERER
   ============================== */

const renderer =
new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio || 1,
    2
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);


/* ==============================
   LIGHT
   ============================== */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  20,
  30,
  10
);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.7
  )
);


/* ==============================
   GROUND
   ============================== */

const ground =
new THREE.Mesh(

  new THREE.PlaneGeometry(
    120,
    120
  ),

  new THREE.MeshStandardMaterial({
    color:0x477d3c
  })

);

ground.rotation.x =
-Math.PI / 2;

scene.add(ground);


/* ==============================
   LOBBY FLOOR
   ============================== */

const floor =
new THREE.Mesh(

  new THREE.CircleGeometry(
    15,
    48
  ),

  new THREE.MeshStandardMaterial({
    color:0x777777
  })

);

floor.rotation.x =
-Math.PI / 2;

floor.position.y =
0.02;

scene.add(floor);


/* ==============================
   BUILDINGS
   ============================== */

function makeBuilding(
  x,
  z,
  w,
  h,
  d
){

  const building =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      w,
      h,
      d
    ),

    new THREE.MeshStandardMaterial({
      color:0xb5b0a5
    })

  );

  building.position.set(
    x,
    h / 2,
    z
  );

  scene.add(building);
}

makeBuilding(
  -22,
  -15,
  14,
  8,
  12
);

makeBuilding(
  22,
  -15,
  14,
  10,
  12
);

makeBuilding(
  -25,
  20,
  16,
  7,
  14
);

makeBuilding(
  25,
  20,
  16,
  9,
  14
);


/* ==============================
   TREES
   ============================== */

function makeTree(
  x,
  z
){

  const trunk =
  new THREE.Mesh(

    new THREE.CylinderGeometry(
      .3,
      .45,
      3,
      8
    ),

    new THREE.MeshStandardMaterial({
      color:0x704522
    })

  );

  trunk.position.set(
    x,
    1.5,
    z
  );

  scene.add(trunk);


  const leaves =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      1.7,
      12,
      12
    ),

    new THREE.MeshStandardMaterial({
      color:0x257d32
    })

  );

  leaves.position.set(
    x,
    4,
    z
  );

  scene.add(leaves);

}


[
  [-10,-12],
  [10,-12],
  [-10,12],
  [10,12],
  [-30,0],
  [30,0]
].forEach(
  p => makeTree(
    p[0],
    p[1]
  )
);


/* ==============================
   PLAYER
   ============================== */

const player =
new THREE.Group();

player.position.set(
  0,
  0,
  8
);

scene.add(player);


/* ==============================
   BODY
   ============================== */

const body =
new THREE.Mesh(

  new THREE.BoxGeometry(
    1,
    1.7,
    .6
  ),

  new THREE.MeshStandardMaterial({
    color:0x111111
  })

);

body.position.y =
2;

player.add(body);


/* ==============================
   HEAD
   ============================== */

const head =
new THREE.Mesh(

  new THREE.SphereGeometry(
    .48,
    24,
    24
  ),

  new THREE.MeshStandardMaterial({
    color:0xd79a72
  })

);

head.position.y =
3.15;

player.add(head);


/* ==============================
   HAIR
   ============================== */

const hair =
new THREE.Mesh(

  new THREE.SphereGeometry(
    .49,
    24,
    12,
    0,
    Math.PI * 2,
    0,
    Math.PI * .45
  ),

  new THREE.MeshStandardMaterial({
    color:0x151515
  })

);

hair.position.y =
3.35;

player.add(hair);


/* ==============================
   LEGS
   ============================== */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x111111
});

const leftLeg =
new THREE.Mesh(

  new THREE.BoxGeometry(
    .28,
    1.2,
    .35
  ),

  legMaterial

);

leftLeg.position.set(
  -.22,
  .6,
  0
);

player.add(leftLeg);


const rightLeg =
new THREE.Mesh(

  new THREE.BoxGeometry(
    .28,
    1.2,
    .35
  ),

  legMaterial

);

rightLeg.position.set(
  .22,
  .6,
  0
);

player.add(rightLeg);


/* ==============================
   ARMS
   ============================== */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x111111
});


const leftArm =
new THREE.Mesh(

  new THREE.BoxGeometry(
    .25,
    1.2,
    .25
  ),

  armMaterial

);

leftArm.position.set(
  -.7,
  2,
  0
);

player.add(leftArm);


const rightArm =
new THREE.Mesh(

  new THREE.BoxGeometry(
    .25,
    1.2,
    .25
  ),

  armMaterial

);

rightArm.position.set(
  .7,
  2,
  0
);

player.add(rightArm);


/* ==============================
   EXPORT GAME OBJECTS
   FOR game.js
   ============================== */

window.gameScene =
scene;

window.gameCamera =
camera;

window.gameRenderer =
renderer;

window.gamePlayer =
player;

window.gameParts = {

  body,
  head,
  hair,

  leftLeg,
  rightLeg,

  leftArm,
  rightArm

};


/* ==============================
   RESIZE
   ============================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* ==============================
   CONNECT GAME.JS
   ============================== */

import "./game.js";

</script>

</body>
</html>
