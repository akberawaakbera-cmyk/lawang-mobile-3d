<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
}

/* LOADING */

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101820;
  color:white;
  font-size:20px;
}

/* LOBBY */

#lobby{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      rgba(0,0,0,.35),
      rgba(0,0,0,.75)
    );
  color:white;
}

#lobby h1{
  font-size:34px;
  margin:0 0 8px;
}

#lobby p{
  margin:0 0 25px;
  opacity:.8;
}

.lobbyButton{
  width:230px;
  padding:16px;
  margin:7px;
  border:0;
  border-radius:12px;
  color:white;
  background:#2388ff;
  font-size:17px;
  font-weight:bold;
}

#playButton{
  background:#22a65a;
}

/* HUD */

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:10px;
  line-height:1.7;
  font-size:14px;
  pointer-events:none;
}

/* CROSSHAIR */

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
  z-index:100;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:24px;
  height:2px;
  top:11px;
}

#crosshair:after{
  width:2px;
  height:24px;
  left:11px;
}

/* JOYSTICK */

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.35);
  z-index:300;
  pointer-events:auto;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  margin-left:-31px;
  margin-top:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.65);
  pointer-events:none;
}

/* BUTTONS */

.gameButton{
  position:fixed;
  z-index:300;
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.15);
  color:white;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
}

#fireButton{
  right:25px;
  bottom:40px;
  width:90px;
  height:90px;
  background:rgba(220,45,45,.55);
}

#jumpButton{
  right:135px;
  bottom:40px;
}

#reloadButton{
  right:145px;
  bottom:120px;
  width:60px;
  height:60px;
  font-size:11px;
}

#gunButton{
  right:35px;
  bottom:155px;
  font-size:12px;
}

#runButton{
  left:180px;
  bottom:40px;
  font-size:12px;
}

#crouchButton{
  right:220px;
  bottom:45px;
  width:58px;
  height:58px;
  font-size:10px;
}

/* MESSAGE */

#message{
  position:fixed;
  left:50%;
  bottom:180px;
  transform:translateX(-50%);
  z-index:400;
  color:white;
  background:rgba(0,0,0,.6);
  padding:8px 15px;
  border-radius:10px;
  display:none;
}

/* HIDE */

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<canvas id="game"></canvas>

<!-- LOBBY -->

<div id="lobby">

  <h1>LAWANG MOBILE</h1>

  <p>3D COMBAT WORLD</p>

  <button
    id="playButton"
    class="lobbyButton">
    ▶ PLAY
  </button>

  <button
    id="weaponLobby"
    class="lobbyButton">
    🔫 WEAPON: PISTOL
  </button>

  <button
    id="mapLobby"
    class="lobbyButton">
    🗺️ MAP: CITY
  </button>

</div>

<!-- HUD -->

<div id="hud" class="hidden">

  <strong>LAWANG MOBILE</strong><br>

  HP:
  <span id="hp">100</span>

  <br>

  Weapon:
  <span id="weapon">PISTOL</span>

  <br>

  Ammo:
  <span id="ammo">12</span>

  <br>

  Score:
  <span id="score">0</span>

</div>

<div id="crosshair" class="hidden"></div>

<div id="message"></div>

<!-- JOYSTICK -->

<div id="joystick" class="hidden">
  <div id="joystickKnob"></div>
</div>

<!-- BUTTONS -->

<div
  id="runButton"
  class="gameButton hidden">
  RUN
</div>

<div
  id="jumpButton"
  class="gameButton hidden">
  JUMP
</div>

<div
  id="reloadButton"
  class="gameButton hidden">
  RELOAD
</div>

<div
  id="gunButton"
  class="gameButton hidden">
  GUN
</div>

<div
  id="fireButton"
  class="gameButton hidden">
  FIRE
</div>

<div
  id="crouchButton"
  class="gameButton hidden">
  CROUCH
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  .1,
  1000
);

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

/* LIGHT */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  20,
  30,
  10
);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    .65
  )
);

/* GROUND */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    120,
    120
  ),
  new THREE.MeshStandardMaterial({
    color:0x3c873c
  })
);

ground.rotation.x=-Math.PI/2;

scene.add(ground);

/* ROADS */

function makeRoad(
  x,
  z,
  w,
  d
){

  const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      .05,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0x303030
    })
  );

  road.position.set(
    x,
    .03,
    z
  );

  scene.add(road);
}

makeRoad(0,0,100,9);
makeRoad(0,0,9,100);

/* BUILDINGS */

function makeBuilding(
  x,
  z,
  w,
  h,
  d
){

  const building =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      h,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0xb9b9b9
    })
  );

  building.position.set(
    x,
    h/2,
    z
  );

  scene.add(building);

  return building;
}

makeBuilding(-18,-18,12,8,10);
makeBuilding(18,-18,12,10,10);
makeBuilding(-18,18,10,7,12);
makeBuilding(18,18,12,9,10);

/* TREES */

function makeTree(
  x,
  z
){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,
      .45,
      3,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x68401f
    })
  );

  trunk.position.set(
    x,
    1.5,
    z
  );

  scene.add(trunk);

  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.8,
      12,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x218c35
    })
  );

  leaves.position.set(
    x,
    4,
    z
  );

  scene.add(leaves);
}

[
  [-8,-8],
  [8,-8],
  [-8,8],
  [8,8],
  [-30,0],
  [30,0],
  [0,-30],
  [0,30]
].forEach(
  p=>makeTree(p[0],p[1])
);

/* PLAYER */

const player =
new THREE.Group();

/* BODY */

const body =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1,
    1.7,
    .6
  ),
  new THREE.MeshStandardMaterial({
    color:0x2388ff
  })
);

body.position.y=2;

player.add(body);

/* HEAD */

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .45,
    20,
    20
  ),
  new THREE.MeshStandardMaterial({
    color:0xf0b48a
  })
);

head.position.y=3.15;

player.add(head);

/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x202020
});

const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,
    1.2,
    .35
  ),
  legMaterial
);

leftLeg.position.set(
  -.22,.6,0
);

player.add(leftLeg);

const rightLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,
    1.2,
    .35
  ),
  legMaterial
);

rightLeg.position.set(
  .22,.6,0
);

player.add(rightLeg);

/* ARMS */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x2388ff
});

const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,
    1.2,
    .25
  ),
  armMaterial
);

leftArm.position.set(
  -.7,2,0
);

player.add(leftArm);

const rightArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,
    1.2,
    .25
  ),
  armMaterial
);

rightArm.position.set(
  .7,2,0
);

player.add(rightArm);

player.position.set(
  0,0,5
);

scene.add(player);

/* EXPOSE */

window.gameScene=scene;
window.gameCamera=camera;
window.gameRenderer=renderer;
window.gamePlayer=player;

window.gameParts={
  body,
  head,
  leftLeg,
  rightLeg,
  leftArm,
  rightArm
};

/* RESIZE */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

/* LOAD GAME JS */

const script =
document.createElement("script");

script.src="game.js";

script.onload=()=>{

  document.getElementById(
    "loading"
  ).classList.add("hidden");

};

script.onerror=()=>{

  document.getElementById(
    "loading"
  ).textContent=
  "game.js not found";

};

document.body.appendChild(script);

/* RENDER */

function render(){

  requestAnimationFrame(render);

  renderer.render(
    scene,
    camera
  );
}

render();

</script>

</body>
</html>
