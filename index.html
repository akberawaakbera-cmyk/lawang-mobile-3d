<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">
<title>LAWANG MOBILE 3D</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  font-family: Arial, sans-serif;
}
#game {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
}
#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101820;
  color: white;
  font-size: 21px;
}
#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;
  color: white;
  background: rgba(0,0,0,0.5);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.6;
  pointer-events: none;
}
/* =========================
   JOYSTICK
========================= */
#joystick {
  position: fixed;
  left: 25px;
  bottom: 30px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.10);
  border: 2px solid
    rgba(255,255,255,0.35);
  z-index: 200;
}
#joystickKnob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 62px;
  height: 62px;
  margin-left: -31px;
  margin-top: -31px;
  border-radius: 50%;
  background: rgba(255,255,255,0.30);
  border: 2px solid
    rgba(255,255,255,0.65);
  pointer-events: none;
}
/* =========================
   RUN
========================= */
#runButton {
  position: fixed;
  left: 175px;
  bottom: 45px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px solid
    rgba(255,255,255,0.5);
  background:
    rgba(35,136,255,0.35);
  color: white;
  font-size: 13px;
  font-weight: bold;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
/* =========================
   CAMERA AREA
========================= */
#cameraArea {
  position: fixed;
  left: 35%;
  top: 0;
  width: 65%;
  height: 70%;
  z-index: 50;
  pointer-events: auto;
}
/* =========================
   DEBUG
========================= */
#status {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  color: white;
  background:
    rgba(0,0,0,0.45);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>
<canvas id="game"></canvas>
<div id="hud">
  <strong>LAWANG MOBILE 3D</strong><br>
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weapon">PISTOL</span><br>
  Score: <span id="score">0</span>
</div>
<!-- CAMERA TOUCH AREA -->
<div id="cameraArea"></div>
<!-- JOYSTICK -->
<div id="joystick">
  <div id="joystickKnob"></div>
</div>
<!-- RUN -->
<div id="runButton">
  RUN
</div>
<div id="status">
  3D TEST
</div>
<!-- GAME ENGINE -->
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
window.THREE = THREE;
const canvas =
  document.getElementById("game");
const scene =
  new THREE.Scene();
scene.background =
  new THREE.Color(0x87ceeb);
// CAMERA
const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );
camera.position.set(
  0,
  4,
  8
);
// RENDERER
const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias: true
  });
renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);
renderer.setSize(
  window.innerWidth,
  window.innerHeight
);
// LIGHT
const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );
sun.position.set(
  10,
  20,
  10
);
scene.add(sun);
scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.7
  )
);
// GROUND
const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      100,
      100
    ),
    new THREE.MeshStandardMaterial({
      color: 0x3b7d3b
    })
  );
ground.rotation.x =
  -Math.PI / 2;
scene.add(ground);
// ROAD
const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      100,
      0.05,
      8
    ),
    new THREE.MeshStandardMaterial({
      color: 0x333333
    })
  );
road.position.y = 0.03;
scene.add(road);
// BUILDINGS
function building(
  x,
  z,
  w,
  h,
  d
) {
  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      new THREE.MeshStandardMaterial({
        color: 0xb8b8b8
      })
    );
  mesh.position.set(
    x,
    h / 2,
    z
  );
  scene.add(mesh);
}
building(-15,-12,10,7,8);
building(15,-12,12,9,9);
building(-18,15,8,6,10);
building(18,15,10,8,8);
// TREES
function tree(x,z) {
  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.35,
        0.45,
        3,
        8
      ),
      new THREE.MeshStandardMaterial({
        color: 0x6b3f20
      })
    );
  trunk.position.set(
    x,
    1.5,
    z
  );
  scene.add(trunk);
  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.8,
        12,
        12
      ),
      new THREE.MeshStandardMaterial({
        color: 0x218c35
      })
    );
  leaves.position.set(
    x,
    4,
    z
  );
  scene.add(leaves);
}
tree(-8,-8);
tree(8,-8);
tree(-8,8);
tree(8,8);
tree(-25,0);
tree(25,0);
// PLAYER
const player =
  new THREE.Group();
// BODY
const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1,
      1.7,
      0.6
    ),
    new THREE.MeshStandardMaterial({
      color: 0x2388ff
    })
  );
body.position.y = 2;
player.add(body);
// HEAD
const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.45,
      20,
      20
    ),
    new THREE.MeshStandardMaterial({
      color: 0xf0b48a
    })
  );
head.position.y = 3.15;
player.add(head);
// LEGS
const legMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x202020
  });
const leftLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.28,
      1.2,
      0.35
    ),
    legMaterial
  );
leftLeg.position.set(
  -0.22,
  0.6,
  0
);
player.add(leftLeg);
const rightLeg =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.28,
      1.2,
      0.35
    ),
    legMaterial
  );
rightLeg.position.set(
  0.22,
  0.6,
  0
);
player.add(rightLeg);
// ARMS
const armMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x2388ff
  });
const leftArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.25,
      1.2,
      0.25
    ),
    armMaterial
  );
leftArm.position.set(
  -0.7,
  2,
  0
);
player.add(leftArm);
const rightArm =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      0.25,
      1.2,
      0.25
    ),
    armMaterial
  );
rightArm.position.set(
  0.7,
  2,
  0
);
player.add(rightArm);
player.position.set(
  0,
  0,
  5
);
scene.add(player);
// EXPOSE GAME OBJECTS
window.gameScene = scene;
window.gameCamera = camera;
window.gameRenderer = renderer;
window.gamePlayer = player;
window.gameParts = {
  leftLeg,
  rightLeg,
  leftArm,
  rightArm,
  body,
  head
};
// RESIZE
window.addEventListener(
  "resize",
  () => {
    camera.aspect =
      window.innerWidth /
      window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);
// START GAME.JS
const script =
  document.createElement("script");
script.src = "game.js";
script.onload = () => {
  document.getElementById(
    "loading"
  ).style.display = "none";
};
script.onerror = () => {
  document.getElementById(
    "loading"
  ).textContent =
    "game.js not found";
};
document.body.appendChild(script);
// RENDER LOOP
function render() {
  requestAnimationFrame(
    render
  );
  renderer.render(
    scene,
    camera
  );
}
render();
</script>
</body>
</html>
