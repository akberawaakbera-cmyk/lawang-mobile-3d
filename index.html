<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>LAWANG MOBILE 3D</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101820;
  color:white;
  font-size:20px;
}

/* =========================
   LOBBY
========================= */

#lobby{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:70px;
  background:
  linear-gradient(
    rgba(0,0,0,.1),
    rgba(0,0,0,.7)
  );
}

#lobbyTitle{
  position:absolute;
  top:45px;
  color:white;
  font-size:32px;
  font-weight:bold;
  text-shadow:0 3px 10px #000;
}

#playButton{
  width:220px;
  height:65px;
  border:0;
  border-radius:15px;
  background:#2388ff;
  color:white;
  font-size:22px;
  font-weight:bold;
}

#lobbyInfo{
  color:white;
  margin-bottom:20px;
  text-align:center;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:500;
  color:white;
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:10px;
  line-height:1.7;
  font-size:14px;
  pointer-events:none;
}

/* =========================
   CAMERA
========================= */

#cameraArea{
  position:fixed;
  right:0;
  top:0;
  width:65%;
  height:70%;
  z-index:100;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
  position:fixed;
  left:25px;
  bottom:30px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.35);
  z-index:500;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:65px;
  height:65px;
  margin-left:-32.5px;
  margin-top:-32.5px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.6);
}

/* =========================
   BUTTONS
========================= */

.control{
  position:fixed;
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.15);
  color:white;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  user-select:none;
}

#fire{
  right:25px;
  bottom:40px;
  width:92px;
  height:92px;
  background:rgba(220,40,40,.45);
  font-size:17px;
}

#jump{
  right:130px;
  bottom:45px;
}

#reload{
  right:145px;
  bottom:125px;
  width:60px;
  height:60px;
  font-size:10px;
}

#gun{
  right:35px;
  bottom:155px;
  font-size:11px;
}

#crouch{
  right:215px;
  bottom:45px;
  width:60px;
  height:60px;
  font-size:10px;
}

#run{
  left:180px;
  bottom:45px;
  background:rgba(35,136,255,.35);
}

/* =========================
   STATUS
========================= */

#status{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:600;
  color:white;
  background:rgba(0,0,0,.5);
  padding:6px 12px;
  border-radius:8px;
  font-size:12px;
  pointer-events:none;
}

/* =========================
   HIDE GAME UI
========================= */

.gameHidden{
  display:none!important;
}

</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<canvas id="game"></canvas>

<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

  <div id="lobbyTitle">
    LAWANG MOBILE
  </div>

  <div id="lobbyInfo">
    3D BATTLE WORLD<br>
    Character Ready
  </div>

  <button id="playButton">
    PLAY
  </button>

</div>

<!-- =========================
     HUD
========================= -->

<div id="hud" class="gameHidden">

  <strong>LAWANG MOBILE 3D</strong><br>

  HP:
  <span id="hp">100</span>

  <br>

  Weapon:
  <span id="weapon">PISTOL</span>

  <br>

  Ammo:
  <span id="ammo">30</span>

  <br>

  Score:
  <span id="score">0</span>

</div>

<!-- CAMERA -->

<div id="cameraArea"
class="gameHidden"></div>

<!-- JOYSTICK -->

<div id="joystick"
class="gameHidden">

  <div id="joystickKnob"></div>

</div>

<!-- BUTTONS -->

<div id="run"
class="control gameHidden">
RUN
</div>

<div id="jump"
class="control gameHidden">
JUMP
</div>

<div id="crouch"
class="control gameHidden">
CROUCH
</div>

<div id="gun"
class="control gameHidden">
GUN
</div>

<div id="reload"
class="control gameHidden">
RELOAD
</div>

<div id="fire"
class="control gameHidden">
FIRE
</div>

<div id="status">
LOBBY
</div>

<!-- =========================
     THREE.JS
========================= -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  .1,
  1000
);

camera.position.set(
  0,4,8
);

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);

/* LIGHT */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  20,30,10
);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    .65
  )
);

/* =========================
   GROUND
========================= */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    120,
    120
  ),
  new THREE.MeshStandardMaterial({
    color:0x3f843f
  })
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

/* =========================
   ROAD
========================= */

function createRoad(
  x,
  z,
  width,
  depth
){

  const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      .06,
      depth
    ),
    new THREE.MeshStandardMaterial({
      color:0x303030
    })
  );

  road.position.set(
    x,
    .03,
    z
  );

  scene.add(road);
}

createRoad(
  0,0,
  100,9
);

createRoad(
  0,0,
  9,100
);

/* =========================
   BUILDINGS
========================= */

function createBuilding(
  x,
  z,
  w,
  h,
  d,
  color=0xb8b8b8
){

  const building =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color
    })
  );

  building.position.set(
    x,
    h/2,
    z
  );

  scene.add(building);

  return building;
}

createBuilding(
  -18,-15,
  12,7,10
);

createBuilding(
  18,-15,
  13,9,11,
  0xa9a9a9
);

createBuilding(
  -18,18,
  10,6,12,
  0xc4a276
);

createBuilding(
  18,18,
  12,8,10,
  0x9d9d9d
);

/* =========================
   TREES
========================= */

function createTree(
  x,z
){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .3,.4,3,8
    ),
    new THREE.MeshStandardMaterial({
      color:0x704522
    })
  );

  trunk.position.set(
    x,1.5,z
  );

  scene.add(trunk);

  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.7,
      12,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x238b35
    })
  );

  leaves.position.set(
    x,4,z
  );

  scene.add(leaves);
}

[
  [-8,-8],
  [8,-8],
  [-8,8],
  [8,8],
  [-30,5],
  [30,-5],
  [-5,30],
  [5,-30]
].forEach(
  p => createTree(
    p[0],
    p[1]
  )
);

/* =========================
   PLAYER
========================= */

const player =
new THREE.Group();

/* BODY */

const body =
new THREE.Mesh(
  new THREE.BoxGeometry(
    1,1.7,.6
  ),
  new THREE.MeshStandardMaterial({
    color:0x2388ff
  })
);

body.position.y=2;

player.add(body);

/* HEAD */

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .45,20,20
  ),
  new THREE.MeshStandardMaterial({
    color:0xf0b48a
  })
);

head.position.y=3.15;

player.add(head);

/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x202020
});

const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,1.2,.35
  ),
  legMaterial
);

leftLeg.position.set(
  -.22,.6,0
);

player.add(leftLeg);

const rightLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,1.2,.35
  ),
  legMaterial
);

rightLeg.position.set(
  .22,.6,0
);

player.add(rightLeg);

/* ARMS */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x2388ff
});

const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,1.2,.25
  ),
  armMaterial
);

leftArm.position.set(
  -.7,2,0
);

player.add(leftArm);

const rightArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,1.2,.25
  ),
  armMaterial
);

rightArm.position.set(
  .7,2,0
);

player.add(rightArm);

player.position.set(
  0,0,10
);

scene.add(player);

/* EXPOSE */

window.gameScene =
scene;

window.gameCamera =
camera;

window.gameRenderer =
renderer;

window.gamePlayer =
player;

window.gameParts = {
  leftLeg,
  rightLeg,
  leftArm,
  rightArm,
  body,
  head
};

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================
   START GAME.JS
========================= */

const script =
document.createElement(
  "script"
);

script.src =
"game.js";

script.onload = ()=>{
  document.getElementById(
    "loading"
  ).style.display="none";
};

script.onerror = ()=>{
  document.getElementById(
    "loading"
  ).textContent =
  "game.js not found";
};

document.body.appendChild(
  script
);

/* =========================
   PLAY BUTTON
========================= */

document.getElementById(
  "playButton"
).onclick=()=>{

  document.getElementById(
    "lobby"
  ).classList.add(
    "gameHidden"
  );

  document.getElementById(
    "hud"
  ).classList.remove(
    "gameHidden"
  );

  document.getElementById(
    "joystick"
  ).classList.remove(
    "gameHidden"
  );

  document.getElementById(
    "cameraArea"
  ).classList.remove(
    "gameHidden"
  );

  document.querySelectorAll(
    ".control"
  ).forEach(
    button =>
      button.classList.remove(
        "gameHidden"
      )
  );

  document.getElementById(
    "status"
  ).textContent =
  "READY";
};

/* =========================
   RENDER
========================= */

function render(){

  requestAnimationFrame(
    render
  );

  renderer.render(
    scene,
    camera
  );
}

render();

</script>

</body>
</html>
