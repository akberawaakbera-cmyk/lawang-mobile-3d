<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>LAWANG MOBILE 3D - COMBAT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#101820;
  color:white;
  font-size:20px;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:100;
  color:white;
  background:rgba(0,0,0,.55);
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.7;
  pointer-events:none;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
  z-index:80;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
}

#crosshair:before{
  width:24px;
  height:2px;
  left:0;
  top:11px;
}

#crosshair:after{
  width:2px;
  height:24px;
  left:11px;
  top:0;
}

#cameraArea{
  position:fixed;
  right:0;
  top:0;
  width:65%;
  height:70%;
  z-index:50;
  touch-action:none;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.35);
  z-index:200;
  touch-action:none;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  margin-left:-31px;
  margin-top:-31px;
  border-radius:50%;
  background:rgba(255,255,255,.30);
  border:2px solid rgba(255,255,255,.65);
  pointer-events:none;
}

.button{
  position:fixed;
  z-index:200;
  width:68px;
  height:68px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  color:white;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
}

#fireButton{
  right:24px;
  bottom:35px;
  width:88px;
  height:88px;
  background:rgba(220,45,45,.55);
}

#fireButton.active{
  background:rgba(255,40,40,.9);
}

#runButton{
  left:175px;
  bottom:38px;
  background:rgba(35,136,255,.35);
}

#jumpButton{
  right:125px;
  bottom:38px;
  background:rgba(50,180,80,.35);
}

#reloadButton{
  right:135px;
  bottom:120px;
  width:58px;
  height:58px;
  font-size:11px;
  background:rgba(255,170,40,.35);
}

#gunButton{
  right:32px;
  bottom:145px;
  background:rgba(130,80,220,.4);
}

#crouchButton{
  right:215px;
  bottom:38px;
  width:58px;
  height:58px;
  font-size:10px;
  background:rgba(80,80,80,.5);
}

#message{
  position:fixed;
  left:50%;
  top:70%;
  transform:translate(-50%,-50%);
  z-index:150;
  color:#fff;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
  pointer-events:none;
}

#status{
  position:fixed;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  color:white;
  background:rgba(0,0,0,.45);
  padding:4px 9px;
  border-radius:8px;
  font-size:11px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="loading">
  Loading LAWANG MOBILE 3D...
</div>

<canvas id="game"></canvas>

<div id="hud">
  <strong>LAWANG MOBILE 3D</strong><br>
  HP: <span id="hp">100</span><br>
  Weapon: <span id="weapon">PISTOL</span><br>
  Ammo: <span id="ammo">12 / 60</span><br>
  Score: <span id="score">0</span>
</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="cameraArea"></div>

<div id="joystick">
  <div id="joystickKnob"></div>
</div>

<div id="runButton" class="button">RUN</div>
<div id="jumpButton" class="button">JUMP</div>
<div id="reloadButton" class="button">RELOAD</div>
<div id="gunButton" class="button">GUN</div>
<div id="crouchButton" class="button">CROUCH</div>
<div id="fireButton" class="button">FIRE</div>

<div id="status">READY</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

window.THREE = THREE;

const canvas =
document.getElementById("game");

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

/* CAMERA */

const camera =
new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1000
);

/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

/* LIGHT */

const sun =
new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  10,20,10
);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.7
  )
);

/* GROUND */

const ground =
new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({
    color:0x397a39
  })
);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

/* ROAD */

const road =
new THREE.Mesh(
  new THREE.BoxGeometry(100,.05,8),
  new THREE.MeshStandardMaterial({
    color:0x303030
  })
);

road.position.y=.03;

scene.add(road);

/* BUILDINGS */

function createBuilding(x,z,w,h,d){

  const building =
  new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color:0xb7b7b7
    })
  );

  building.position.set(
    x,
    h/2,
    z
  );

  scene.add(building);
}

createBuilding(-15,-13,10,7,8);
createBuilding(15,-13,12,9,9);
createBuilding(-18,15,8,6,10);
createBuilding(18,15,10,8,8);

/* TREES */

function createTree(x,z){

  const trunk =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .35,.45,3,8
    ),
    new THREE.MeshStandardMaterial({
      color:0x68401f
    })
  );

  trunk.position.set(x,1.5,z);

  scene.add(trunk);

  const leaves =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1.8,12,12
    ),
    new THREE.MeshStandardMaterial({
      color:0x218c35
    })
  );

  leaves.position.set(
    x,4,z
  );

  scene.add(leaves);
}

[
 [-8,-8],
 [8,-8],
 [-8,8],
 [8,8],
 [-25,0],
 [25,0],
 [-30,-20],
 [30,20]
].forEach(p =>
  createTree(p[0],p[1])
);

/* PLAYER */

const player =
new THREE.Group();

const body =
new THREE.Mesh(
  new THREE.BoxGeometry(1,1.7,.6),
  new THREE.MeshStandardMaterial({
    color:0x2388ff
  })
);

body.position.y=2;

player.add(body);

const head =
new THREE.Mesh(
  new THREE.SphereGeometry(
    .45,20,20
  ),
  new THREE.MeshStandardMaterial({
    color:0xf0b48a
  })
);

head.position.y=3.15;

player.add(head);

/* LEGS */

const legMaterial =
new THREE.MeshStandardMaterial({
  color:0x202020
});

const leftLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,1.2,.35
  ),
  legMaterial
);

leftLeg.position.set(
  -.22,.6,0
);

player.add(leftLeg);

const rightLeg =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .28,1.2,.35
  ),
  legMaterial
);

rightLeg.position.set(
  .22,.6,0
);

player.add(rightLeg);

/* ARMS */

const armMaterial =
new THREE.MeshStandardMaterial({
  color:0x2388ff
});

const leftArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,1.2,.25
  ),
  armMaterial
);

leftArm.position.set(
  -.7,2,0
);

player.add(leftArm);

const rightArm =
new THREE.Mesh(
  new THREE.BoxGeometry(
    .25,1.2,.25
  ),
  armMaterial
);

rightArm.position.set(
  .7,2,0
);

player.add(rightArm);

player.position.set(
  0,0,5
);

scene.add(player);

/* EXPOSE */

window.gameScene=scene;
window.gameCamera=camera;
window.gameRenderer=renderer;
window.gamePlayer=player;

window.gameParts={
  body,
  head,
  leftLeg,
  rightLeg,
  leftArm,
  rightArm
};

/* RESIZE */

window.addEventListener(
"resize",
()=>{

  camera.aspect =
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

/* GAME JS */

const script =
document.createElement("script");

script.src="game.js";

script.onload=()=>{
  document.getElementById(
    "loading"
  ).style.display="none";
};

script.onerror=()=>{
  document.getElementById(
    "loading"
  ).textContent=
  "game.js not found";
};

document.body.appendChild(script);

/* RENDER */

function render(){

  requestAnimationFrame(render);

  renderer.render(
    scene,
    camera
  );
}

render();

</script>

</body>
</html>
